services:
  - type: web
    name: personal-portfolio-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: personal-portfolio-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://personal-portfolio.onrender.com

  - type: static
    name: personal-portfolio
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://personal-portfolio-api.onrender.com

databases:
  - name: personal-portfolio-db
    plan: free
    databaseName: personal_portfolio
    user: portfolio